{% load static %}<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Ensalamento{% endblock %} · Univille</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="{% static 'core/app.css' %}" rel="stylesheet">
  <style>
    /* Cores de destaque vêm de settings.TEMA_CORES (troque lá para mudar o tema) */
    :root, [data-theme=light] {
      --p: {{ tema_primaria_oklch }}; --pc: 100% 0 0;
      --b1: 100% 0 0; --b2: 96.8% 0.006 160; --b3: 92% 0.01 160; --bc: 27% 0.02 160;
      --rounded-btn: .5rem; --rounded-box: .75rem;
      --cor-menu: {{ tema.menu }}; --cor-fundo: {{ tema.fundo }};
    }
    body { font-family: Inter, system-ui, sans-serif; background: var(--cor-fundo); }
    .bg-menu { background: var(--cor-menu); }
    [x-cloak] { display: none !important; }
    @media print { .no-print { display: none !important; } body { background: #fff; } }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="min-h-screen text-base-content">
{% block corpo %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
